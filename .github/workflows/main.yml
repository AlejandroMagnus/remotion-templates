name: Render Video Juridico V2 Sync

on:
  workflow_dispatch:
    inputs:
      production_code:
        description: "Production code"
        required: true
        default: "video-juridico-002"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      PRODUCTION_CODE: ${{ inputs.production_code }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Instalar FFmpeg y edge-tts actual
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install "edge-tts==7.2.8" --break-system-packages
          python3 -m edge_tts --version

      - name: Preparar directorios
        run: |
          rm -rf public/generated
          mkdir -p public/generated
          rm -rf out
          mkdir -p out

      - name: Generar narracion y timeline palabra por palabra
        run: |
          python3 <<'PY'
          import asyncio
          import json
          import os
          import time
          from pathlib import Path
          import edge_tts

          code = os.environ["PRODUCTION_CODE"]

          SPEC = Path(f"examples/{code}.video.json")
          AUDIO = Path(f"public/generated/{code}-narration.mp3")
          TIMELINE = Path(f"public/generated/{code}-timeline.json")
          SRT = Path(f"public/generated/{code}.srt")

          spec = json.loads(SPEC.read_text(encoding="utf-8"))
          text = spec["audio"]["narrationText"].strip()

          if not text:
              raise RuntimeError("narrationText esta vacio")

          def srt_time(ms: int) -> str:
              hours = ms // 3_600_000
              ms %= 3_600_000
              minutes = ms // 60_000
              ms %= 60_000
              seconds = ms // 1_000
              millis = ms % 1_000
              return f"{hours:02}:{minutes:02}:{seconds:02},{millis:03}"

          async def synthesize_once():
              if AUDIO.exists():
                  AUDIO.unlink()

              communicate = edge_tts.Communicate(
                  text,
                  "es-BO-MarceloNeural",
                  rate="-5%",
                  boundary="WordBoundary",
                  connect_timeout=20,
                  receive_timeout=90,
              )

              words = []

              with AUDIO.open("wb") as audio_file:
                  async for chunk in communicate.stream():
                      if chunk["type"] == "audio":
                          audio_file.write(chunk["data"])

                      elif chunk["type"] == "WordBoundary":
                          start_ms = round(chunk["offset"] / 10000)
                          duration_ms = round(chunk["duration"] / 10000)

                          words.append({
                              "text": chunk["text"],
                              "startMs": start_ms,
                              "endMs": start_ms + duration_ms,
                          })

              return words

          async def main():
              words = None
              last_error = None

              for attempt in range(1, 4):
                  try:
                      print(f"Intento TTS {attempt}/3")
                      words = await synthesize_once()
                      break
                  except Exception as error:
                      last_error = error

                      if AUDIO.exists():
                          AUDIO.unlink()

                      print(
                          f"Intento {attempt} fallo: "
                          f"{type(error).__name__}: {error}"
                      )

                      if attempt < 3:
                          await asyncio.sleep(5 * attempt)

              if words is None:
                  raise RuntimeError(
                      "TTS fallo despues de 3 intentos. "
                      f"Ultimo error: {last_error}"
                  )

              if not AUDIO.exists() or AUDIO.stat().st_size == 0:
                  raise RuntimeError("No se genero audio valido")

              if len(words) < 5:
                  raise RuntimeError(
                      f"Timeline invalido: solo {len(words)} palabras"
                  )

              previous_start = -1

              for index, word in enumerate(words):
                  if word["startMs"] < previous_start:
                      raise RuntimeError(
                          f"Timeline no monotono en palabra {index}"
                      )

                  if word["endMs"] < word["startMs"]:
                      raise RuntimeError(
                          f"Duracion invalida en palabra {index}"
                      )

                  previous_start = word["startMs"]

              timeline_data = {
                  "schemaVersion": "2.0",
                  "language": "es-BO",
                  "voice": "es-BO-MarceloNeural",
                  "wordCount": len(words),
                  "durationMs": words[-1]["endMs"],
                  "words": words,
              }

              TIMELINE.write_text(
                  json.dumps(
                      timeline_data,
                      ensure_ascii=False,
                      indent=2,
                  ),
                  encoding="utf-8",
              )

              srt_blocks = []

              for index, word in enumerate(words, start=1):
                  srt_blocks.append(
                      f"{index}\n"
                      f"{srt_time(word['startMs'])} --> "
                      f"{srt_time(word['endMs'])}\n"
                      f"{word['text']}\n"
                  )

              SRT.write_text(
                  "\n".join(srt_blocks),
                  encoding="utf-8",
              )

              print("======================================")
              print("SINCRONIZACION GENERADA CORRECTAMENTE")
              print(f"Palabras: {len(words)}")
              print(f"Duracion: {words[-1]['endMs']} ms")
              print(f"Audio: {AUDIO.stat().st_size} bytes")
              print(f"Timeline: {TIMELINE}")
              print(f"SRT: {SRT}")
              print("======================================")

          asyncio.run(main())
          PY
          
      - name: Build semantic director decisions
        run: npx --yes tsx scripts/build-semantic-decisions.ts
   
      - name: Build asset scene plan
        run: npx --yes tsx scripts/build-asset-scene-plan.ts

      - name: Resolve real assets
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: npx --yes tsx scripts/build-resolved-assets.ts

      - name: Verify resolved assets
        run: |
          test -s "public/generated/${PRODUCTION_CODE}-resolved-assets.json"
          test -d public/generated/assets
          test "$(find public/generated/assets -type f | wc -l)" -gt 0
          echo "REAL ASSETS VERIFIED"
          find public/generated/assets -type f -maxdepth 1 -print
      - name: Auditar archivos sincronizados
        run: |
          test -s "public/generated/${PRODUCTION_CODE}-narration.mp3"
          test -s "public/generated/${PRODUCTION_CODE}-timeline.json"
          test -s "public/generated/${PRODUCTION_CODE}.srt"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          code = os.environ["PRODUCTION_CODE"]

          path = Path(
              f"public/generated/{code}-timeline.json"
          )

          data = json.loads(path.read_text(encoding="utf-8"))
          words = data.get("words", [])

          assert len(words) >= 5
          assert data["wordCount"] == len(words)
          assert data["durationMs"] > 0

          print(
              f"QA TIMELINE OK: "
              f"{len(words)} palabras / "
              f"{data['durationMs']} ms"
          )
          PY

      - name: Validar VideoSpec
        run: |
          npm run video:validate -- \
            examples/${PRODUCTION_CODE}.video.json

      - name: Renderizar V2 sincronizada
        run: |
          npm run video:render -- \
            examples/${PRODUCTION_CODE}.video.json

      - name: Verificar MP4 universal
        run: |
          test -s "out/${PRODUCTION_CODE}.mp4"

          cp             "out/${PRODUCTION_CODE}.mp4"             "out/${PRODUCTION_CODE}-FINAL.mp4"

          test -s "out/${PRODUCTION_CODE}-FINAL.mp4"
          ls -lh "out/${PRODUCTION_CODE}-FINAL.mp4"

      - name: Subir MP4 final
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCTION_CODE }}-FINAL
          path: out/${{ env.PRODUCTION_CODE }}-FINAL.mp4
          retention-days: 7
          if-no-files-found: error
