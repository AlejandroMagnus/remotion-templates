name: Render Video Juridico V2 Sync

on:
  workflow_dispatch:
    inputs:
      video_number:
        description: "Número del catálogo SILEC: 1, 001, VIDEO-001 o video-001"
        required: false
        default: "001"
        type: string

      production_code:
        description: "Production code avanzado. Déjalo vacío si usarás video_number."
        required: false
        default: ""
        type: string

      content_mode:
        description: "Content generation mode"
        required: true
        default: "existing"
        type: choice
        options:
          - autonomous
          - directed
          - existing

      requested_topic:
        description: "Optional topic for directed mode"
        required: false
        default: ""
        type: string

      requested_angle:
        description: "Optional angle for directed mode"
        required: false
        default: ""
        type: string

      q_infinity_priority_id:
        description: "ID de ficha priorizada por Q∞ 01 (opcional)"
        required: false
        type: string

      q_infinity_reason:
        description: "Motivo de la prioridad o veto Q∞ 01"
        required: false
        type: string

      q_infinity_veto_ids:
        description: "IDs vetados por Q∞ 01, separados por coma"
        required: false
        type: string

      enable_3d:
        description: "Activar 3D nativo en escenas compatibles de expediente y prueba"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

# La lectura y el registro del canal 3 comparten una única secuencia de producción.
concurrency:
  group: editorial-channel-3
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest

    env:
      CONTENT_MODE: ${{ inputs.content_mode }}
      ENABLE_3D: ${{ inputs.enable_3d }}
      REQUESTED_TOPIC: ${{ inputs.requested_topic }}
      REQUESTED_ANGLE: ${{ inputs.requested_angle }}
      QINFINITY_PRIORITY_ID: ${{ inputs.q_infinity_priority_id }}
      QINFINITY_REASON: ${{ inputs.q_infinity_reason }}
      QINFINITY_VETO_IDS: ${{ inputs.q_infinity_veto_ids }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Resolver ID de video SILEC
        shell: bash
        run: |
          RAW_VIDEO="${{ inputs.video_number }}"
          RAW_PRODUCTION="${{ inputs.production_code }}"

          # Prioridad: si production_code viene lleno, se respeta.
          # Si está vacío, se usa video_number. Esto evita que el workflow
          # quede con PRODUCTION_CODE vacío y falle en content/.silec.json.
          if [ -n "$(echo "$RAW_PRODUCTION" | xargs)" ]; then
            raw="$(echo "$RAW_PRODUCTION" | tr '[:upper:]' '[:lower:]' | xargs)"
          else
            raw="$(echo "$RAW_VIDEO" | tr '[:upper:]' '[:lower:]' | xargs)"
          fi

          if [ -z "$raw" ]; then
            raw="001"
          fi

          if [[ "$raw" =~ ^[0-9]+$ ]]; then
            number=$((10#$raw))
            if [ "$number" -lt 1 ] || [ "$number" -gt 100 ]; then
              echo "ERROR: video_number debe estar entre 1 y 100. Recibido: $raw"
              exit 1
            fi
            code=$(printf "video-%03d" "$number")
          elif [[ "$raw" =~ ^video-([0-9]{1,3})$ ]]; then
            number="${BASH_REMATCH[1]}"
            number=$((10#$number))
            if [ "$number" -lt 1 ] || [ "$number" -gt 100 ]; then
              echo "ERROR: video_number debe estar entre 1 y 100. Recibido: $raw"
              exit 1
            fi
            code=$(printf "video-%03d" "$number")
          else
            code="$raw"
          fi

          echo "PRODUCTION_CODE=$code" >> "$GITHUB_ENV"
          echo "SILEC_PATH=content/${code}.silec.json" >> "$GITHUB_ENV"
          echo "VIDEOSPEC_PATH=examples/${code}.video.json" >> "$GITHUB_ENV"
          echo "Código resuelto: $code"
          echo "SILEC esperado: content/${code}.silec.json"
          echo "VideoSpec esperado: examples/${code}.video.json"

      - name: Configurar Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar TypeScript
        run: npm run typecheck

      - name: Verificar catálogo y regresiones editoriales
        run: |
          npm run editorial:catalog -- check
          npm run test:editorial

      - name: Verificar contratos y regresiones 3D
        run: npm run test:3d

      - name: Validar código de producción
        run: |
          if [[ ! "$PRODUCTION_CODE" =~ ^[a-zA-Z0-9][a-zA-Z0-9_-]*$ ]]; then
            echo "Código de producción inválido."
            exit 1
          fi

      - name: Verificar paquete SILEC por número
        run: |
          echo "PRODUCTION_CODE=$PRODUCTION_CODE"
          echo "SILEC_PATH=$SILEC_PATH"
          echo "VIDEOSPEC_PATH=$VIDEOSPEC_PATH"

          if [ ! -s "$SILEC_PATH" ]; then
            echo "ERROR: No existe o está vacío: $SILEC_PATH"
            echo "Archivos content/video-* disponibles:"
            ls -1 content/video-*.silec.json 2>/dev/null | head -30 || true
            exit 1
          fi

          if [ "$CONTENT_MODE" = "existing" ] && [ ! -s "$VIDEOSPEC_PATH" ]; then
            echo "ERROR: En modo existing no existe o está vacío: $VIDEOSPEC_PATH"
            echo "Archivos examples/video-* disponibles:"
            ls -1 examples/video-*.video.json 2>/dev/null | head -30 || true
            exit 1
          fi

          python3 -m json.tool "$SILEC_PATH" > /dev/null
          if [ "$CONTENT_MODE" = "existing" ]; then
            python3 -m json.tool "$VIDEOSPEC_PATH" > /dev/null
          fi

          echo "PAQUETE SILEC CONFIRMADO: $PRODUCTION_CODE"

      - name: Instalar FFmpeg y edge-tts actual
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install "edge-tts==7.2.8" --break-system-packages
          python3 -m edge_tts --version

      - name: Preparar directorios
        run: |
          rm -rf public/generated
          mkdir -p public/generated
          rm -rf out
          mkdir -p out

      # ============================================================
      # V3.17 — DIRECTOR AUTÓNOMO DE CONTENIDO HIGH-TICKET
      # ============================================================

      - name: V3.17-C — Seleccionar contenido y mostrar ficha editorial
        if: ${{ inputs.content_mode == 'autonomous' || inputs.content_mode == 'directed' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ "${CONTENT_MODE}" = "directed" ]; then
            if [ -z "${REQUESTED_TOPIC}" ] && [ -z "${REQUESTED_ANGLE}" ]; then
              echo "ERROR: directed mode requiere requested_topic o requested_angle."
              exit 1
            fi

            npx --yes tsx scripts/autonomous-content-director.ts \
              "${PRODUCTION_CODE}" \
              "${REQUESTED_TOPIC}" \
              "${REQUESTED_ANGLE}"
          else
            npx --yes tsx scripts/autonomous-content-director.ts \
              "${PRODUCTION_CODE}"
          fi

      - name: Verificar SILEC input
        run: |
          test -s "$SILEC_PATH"

          echo ""
          echo "=============================================="
          echo "SILEC INPUT CONFIRMADO"
          echo "=============================================="
          echo "Production: ${PRODUCTION_CODE}"
          echo "Mode: ${CONTENT_MODE}"
          echo "SILEC: ${SILEC_PATH}"
          echo "=============================================="

      # ============================================================
      # V3.16 — SILEC / PhD 12 → Q∞ → MEMORIA EDITORIAL
      # ============================================================

      - name: Construir paquete estratégico SILEC → Q∞
        run: |
          npx --yes tsx scripts/build-strategic-content-packet.ts \
            "${PRODUCTION_CODE}"

      - name: Precheck de Memoria Editorial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx --yes tsx scripts/editorial-memory.ts \
            precheck \
            "${PRODUCTION_CODE}"

      # ============================================================
      # V3.18 — DIRECTOR CREATIVO-ESTRATÉGICO AUTÓNOMO Q∞
      # ============================================================

      - name: V3.18-B — Leer Memoria Creativa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx --yes tsx scripts/creative-memory.ts \
            read \
            "${PRODUCTION_CODE}"

      - name: V3.18-C — Seleccionar perfil creativo
        run: |
          npx --yes tsx scripts/build-creative-decision.ts \
            "${PRODUCTION_CODE}"

          test -s \
            "public/generated/${PRODUCTION_CODE}-creative-decision.json"

      - name: V4.9 — Singularidad runtime preservando Human Value
        if: ${{ inputs.content_mode == 'autonomous' || inputs.content_mode == 'directed' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SINGULARITY_RUNTIME_ENABLED: "1"
        run: |
          approved=0

          for attempt in 0 1 2 3 4 5; do
            echo "=== GENOMA NARRATIVO ${attempt} ==="
            export SINGULARITY_ATTEMPT="${attempt}"

            npx --yes tsx scripts/build-autonomous-video-spec.ts               "${PRODUCTION_CODE}"

            if npx --yes tsx scripts/narrative-novelty-gate.ts               "${PRODUCTION_CODE}"; then
              approved=1
              echo "NOVEDAD_NARRATIVA_APROBADA=${attempt}"
              break
            else
              status=$?
              if [[ "${status}" -ne 42 ]]; then
                echo "ERROR: el gate de novedad falló por una causa distinta a similitud."
                exit "${status}"
              fi
              echo "Guion demasiado parecido. Probando otro genoma..."
            fi
          done

          if [[ "${approved}" -ne 1 ]]; then
            echo "NARRATIVE_NOVELTY_EXHAUSTED"
            echo "No se renderiza otro video repetitivo."
            exit 1
          fi
      - name: Gate final — bloquear muletilla antes del TTS
        run: |
          python3 scripts/final-narration-gate.py "${PRODUCTION_CODE}"
          python3 - <<'PYVERIFY'
          import json, os, pathlib, re, unicodedata
          code = os.environ['PRODUCTION_CODE']
          p = pathlib.Path(f'examples/{code}.video.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          text = data['audio']['narrationText']
          meta = data.get('meta', {}).get('finalNarrationGate', {})
          if meta.get('version') != 'FINAL-NARRATION-GATE-V1':
              raise SystemExit('FINAL_GATE_MISSING')
          print('FINAL_GATE_CONFIRMED')
          print('FINAL_OPENING=' + re.split(r'(?<=[.!?])\\s+', text, maxsplit=1)[0])
          PYVERIFY

      - name: Sincronizar ejemplos SILEC
        if: ${{ inputs.content_mode == 'existing' }}
        run: npx --yes tsx scripts/sync-silec-video-examples.ts

      - name: Construir plan de valor humano
        run: |
          npx --yes tsx scripts/build-human-value-plan.ts "${PRODUCTION_CODE}"
          test -s "public/generated/${PRODUCTION_CODE}-human-value-plan.json"

      - name: Valor humano — Revisar guion antes de generar voz
        run: |
          npx --yes tsx scripts/review-human-value.ts "${PRODUCTION_CODE}" script

      - name: Auditoría de autoría — Autocorrección intelectual antes del TTS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          run_builder() {
            approved=0

            for attempt in 0 1 2 3 4 5; do
              echo "=== GENOMA NARRATIVO ${attempt} ==="
              export SINGULARITY_ATTEMPT="${attempt}"

              npx --yes tsx scripts/build-autonomous-video-spec.ts               "${PRODUCTION_CODE}"

              if npx --yes tsx scripts/narrative-novelty-gate.ts               "${PRODUCTION_CODE}"; then
                approved=1
                echo "NOVEDAD_NARRATIVA_APROBADA=${attempt}"
                break
              else
                status=$?
                if [[ "${status}" -ne 42 ]]; then
                  echo "ERROR: el gate de novedad falló por una causa distinta a similitud."
                  exit "${status}"
                fi
                echo "Guion demasiado parecido. Probando otro genoma..."
              fi
            done

            if [[ "${approved}" -ne 1 ]]; then
              echo "NARRATIVE_NOVELTY_EXHAUSTED"
              echo "No se renderiza otro video repetitivo."
              exit 1
            fi
          }

          run_human_plan() {
            npx --yes tsx scripts/build-human-value-plan.ts "${PRODUCTION_CODE}"
            test -s "public/generated/${PRODUCTION_CODE}-human-value-plan.json"
          }

          run_human_review() {
            npx --yes tsx scripts/review-human-value.ts "${PRODUCTION_CODE}" script
          }

          approved=0

          for attempt in 0 1 2 3 4 5; do
            echo ""
            echo "============================================================"
            echo "DIRECTOR DE AUTORÍA — INTENTO ${attempt}"
            echo "============================================================"

            npx --yes tsx scripts/build-authorial-plan.ts \
              "${PRODUCTION_CODE}" \
              "${attempt}"

            export AUTHORIAL_PLAN_PATH="public/generated/${PRODUCTION_CODE}-authorial-plan.json"

            run_builder
            run_human_plan

            if ! run_human_review; then
              echo "AUTORIA_INTENTO_${attempt}=RECHAZADO_POR_HUMAN_VALUE"
              continue
            fi

            if npx --yes tsx scripts/audit-authorship-singularity.ts \
              "${PRODUCTION_CODE}" \
              script; then
              approved=1
              echo "AUTORIA_APROBADA_EN_INTENTO=${attempt}"
              break
            fi

            echo "AUTORIA_INTENTO_${attempt}=NO_SUPERA_76"
          done

          if [[ "${approved}" -ne 1 ]]; then
            echo "AUTHORIAL_EXCELLENCE_NOT_REACHED"
            echo "Ninguna de las seis concepciones alcanzó el estándar de autoría."
            exit 1
          fi

          test -s "public/generated/${PRODUCTION_CODE}-authorial-plan.json"
          test -s "public/generated/${PRODUCTION_CODE}-authorship-audit.json"
      - name: Verificar entrada audiovisual
        run: |
          test -s "$SILEC_PATH"
          test -s "$VIDEOSPEC_PATH"
          test -s "public/generated/${PRODUCTION_CODE}-creative-memory.json"
          test -s "public/generated/${PRODUCTION_CODE}-creative-decision.json"

          echo ""
          echo "=============================================="
          echo "ENTRADA AUDIOVISUAL V3.18 CONFIRMADA"
          echo "=============================================="
          echo "Production: ${PRODUCTION_CODE}"
          echo "Mode: ${CONTENT_MODE}"
          echo "SILEC: ${SILEC_PATH}"
          echo "VideoSpec: ${VIDEOSPEC_PATH}"
          echo "Creative Memory: public/generated/${PRODUCTION_CODE}-creative-memory.json"
          echo "Creative Decision: public/generated/${PRODUCTION_CODE}-creative-decision.json"
          echo "=============================================="

      # ============================================================
      # V3.19-E.3 — HUMAN VOICE PERFORMANCE DIRECTOR
      #
      # VideoSpec + Creative Decision
      # → comprensión semántica y sintáctica
      # → partitura vocal
      # → E.2 / TTS
      # → WordBoundary
      # → timeline sincronizado
      #
      # E.3 NO modifica WordBoundary.
      # E.3 NO modifica la sincronización.
      # ============================================================

      - name: V3.19-E.3 — Construir partitura vocal semántica
        run: |
          python3 scripts/human_voice_performance_director.py

          test -s \
            "public/generated/${PRODUCTION_CODE}-vocal-score.json"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          code = os.environ["PRODUCTION_CODE"]

          path = Path(
              f"public/generated/{code}-vocal-score.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          assert (
              data.get("version")
              == "V3.19-E.3-HUMAN-VOICE-PERFORMANCE-DIRECTOR"
          )

          units = data.get("units", [])

          assert len(units) > 0

          qa = data.get("qa", {})

          print("")
          print("==============================================")
          print("E.3 HUMAN VOICE PERFORMANCE DIRECTOR")
          print("==============================================")
          print(f"Production: {code}")
          print(f"Vocal units: {len(units)}")
          print(
              f"Global intention: "
              f"{data.get('global_intention', '')}"
          )
          print(
              f"Narrative arc: "
              f"{data.get('narrative_arc', '')}"
          )
          print(
              f"QA passed: "
              f"{qa.get('passed')}"
          )
          print("==============================================")
          PY

      # ============================================================
      # PIPELINE AUDIOVISUAL VALIDADO
      # ============================================================

      - name: Verificar interpretación vocal y contrato WordBoundary
        run: python3 -B -m unittest discover -s tests -p 'test_vocal_delivery.py'

      - name: Generar narración prosódica y timeline palabra por palabra
        run: |
          python3 scripts/generate-prosodic-narration.py

      - name: Calcular duración adaptativa
        run: |
          npx --yes tsx scripts/apply-adaptive-duration.ts

      - name: Build semantic director decisions
        run: |
          npx --yes tsx scripts/build-semantic-decisions.ts

      - name: Build asset scene plan
        run: |
          npx --yes tsx scripts/build-asset-scene-plan.ts

      - name: Restaurar memoria y búsquedas visuales
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/visual-memory-v2.json
            .cache/visual-search-v2
          key: visual-library-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: visual-library-v2-${{ github.ref_name }}-

      - name: Verificar biblioteca visual
        run: |
          npm run assets:library -- check
          npm run test:visual

      - name: Planificar escenas 3D sobre la narración sincronizada
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node --import tsx scripts/build-three-d-plan.ts

      - name: Resolve real assets
        id: visual_assets
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx --yes tsx scripts/build-resolved-assets.ts

      - name: Guardar memoria y caché de búsquedas visuales
        if: always() && (steps.visual_assets.outcome == 'success' || steps.visual_assets.outcome == 'failure')
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/visual-memory-v2.json
            .cache/visual-search-v2
          key: visual-library-v2-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: AUDITORIA MAESTRA DE ORQUESTACION
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          code = os.environ["PRODUCTION_CODE"]

          timeline_path = Path(
              f"public/generated/{code}-timeline.json"
          )

          score_path = Path(
              f"public/generated/{code}-audiovisual-score.json"
          )

          plan_path = Path(
              f"public/generated/{code}-asset-scene-plan.json"
          )

          resolved_path = Path(
              f"public/generated/{code}-resolved-assets.json"
          )

          print("")
          print("==============================================")
          print("AUDITORIA MAESTRA DE ORQUESTACION AUDIOVISUAL")
          print("==============================================")
          print(f"Production: {code}")

          timeline = json.loads(
              timeline_path.read_text(encoding="utf-8")
          )

          print("")
          print(
              f"NARRACION: "
              f"{timeline.get('wordCount', 0)} palabras | "
              f"{timeline.get('durationMs', 0)} ms"
          )

          if score_path.exists():
              score = json.loads(
                  score_path.read_text(encoding="utf-8")
              )

              beats = score.get("beats", [])

              print("")
              print(f"MASTER DIRECTOR BEATS: {len(beats)}")

              for i, beat in enumerate(beats[:20], 1):
                  start = int(beat.get("startMs", 0))
                  end = int(beat.get("endMs", 0))

                  print(
                      f"  B{i:02}: "
                      f"{start:>6} -> {end:>6} "
                      f"({end-start:>5} ms) | "
                      f"{beat.get('intent', '')}"
                  )
          else:
              print("")
              print("MASTER DIRECTOR SCORE: NO EXISTE")

          plan = json.loads(
              plan_path.read_text(encoding="utf-8")
          )

          scenes = plan.get("scenes", [])

          print("")
          print(f"ASSET SCENE PLAN: {len(scenes)} escenas")

          for i, scene in enumerate(scenes[:30], 1):
              start = int(scene.get("startMs", 0))
              end = int(scene.get("endMs", 0))

              print(
                  f"  S{i:02}: "
                  f"{start:>6} -> {end:>6} "
                  f"({end-start:>5} ms) | "
                  f"{scene.get('ruleId', '')}"
              )

          resolved = json.loads(
              resolved_path.read_text(encoding="utf-8")
          )

          assets = resolved.get("assets", [])

          good = [
              asset
              for asset in assets
              if asset.get("status") == "resolved"
          ]

          print("")
          print(
              f"RESOLVED ASSETS: "
              f"{len(good)} resueltos / "
              f"{len(assets)} totales"
          )

          for i, asset in enumerate(good[:30], 1):
              start = int(asset.get("startMs", 0))
              end = int(asset.get("endMs", 0))

              provider_id = (
                  asset.get("asset", {}).get(
                      "providerId",
                      "",
                  )
              )

              print(
                  f"  A{i:02}: "
                  f"{start:>6} -> {end:>6} "
                  f"({end-start:>5} ms) | "
                  f"provider={provider_id} | "
                  f"{asset.get('ruleId', '')}"
              )

          print("")
          print("------------- DIAGNOSTICO -------------")

          if not scenes:
              raise RuntimeError(
                  "FALLO: Asset Scene Plan no contiene escenas."
              )

          if not good:
              raise RuntimeError(
                  "FALLO: No existen assets resueltos."
              )

          first_30s = [
              asset
              for asset in good
              if int(asset.get("startMs", 0)) < 30000
          ]

          print(
              f"Assets distintos iniciados antes de 30 s: "
              f"{len(first_30s)}"
          )

          long_scenes = [
              scene
              for scene in scenes
              if (
                  int(scene.get("endMs", 0))
                  - int(scene.get("startMs", 0))
              ) > 7000
          ]

          long_assets = [
              asset
              for asset in good
              if (
                  int(asset.get("endMs", 0))
                  - int(asset.get("startMs", 0))
              ) > 7000
          ]

          print(
              f"Escenas > 7 s: {len(long_scenes)}"
          )

          print(
              f"Assets resueltos > 7 s: {len(long_assets)}"
          )

          if len(first_30s) <= 1:
              print(
                  "ALERTA: el resolver solo entrega una imagen "
                  "durante aproximadamente los primeros 30 s."
              )
          else:
              print(
                  "OK: existen multiples assets dentro de "
                  "los primeros 30 s."
              )

          print("==============================================")
          PY

      - name: Verify resolved assets
        run: |
          test -s "public/generated/${PRODUCTION_CODE}-resolved-assets.json"
          test -d "public/generated/${PRODUCTION_CODE}/assets"
          test "$(find "public/generated/${PRODUCTION_CODE}/assets" -type f | wc -l)" -gt 0

          echo "REAL ASSETS VERIFIED"

          find "public/generated/${PRODUCTION_CODE}/assets" \
            -maxdepth 1 \
            -type f \
            -print

      - name: Auditar archivos sincronizados
        run: |
          test -s "public/generated/${PRODUCTION_CODE}-narration.mp3"
          test -s "public/generated/${PRODUCTION_CODE}-timeline.json"
          test -s "public/generated/${PRODUCTION_CODE}.srt"
          test -s "public/generated/${PRODUCTION_CODE}-prosody-plan.json"

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          code = os.environ["PRODUCTION_CODE"]

          timeline_path = Path(
              f"public/generated/{code}-timeline.json"
          )

          prosody_path = Path(
              f"public/generated/{code}-prosody-plan.json"
          )

          data = json.loads(
              timeline_path.read_text(encoding="utf-8")
          )

          prosody = json.loads(
              prosody_path.read_text(encoding="utf-8")
          )

          words = data.get("words", [])

          assert len(words) >= 5
          assert data["wordCount"] == len(words)
          assert data["durationMs"] > 0

          assert (
              data.get("version")
              == "V3.15-C-PROSODY-DIRECTOR"
          )

          assert (
              prosody.get("version")
              == "V3.15-C-PROSODY-DIRECTOR"
          )

          assert (
              len(prosody.get("segments", []))
              > 0
          )

          print(
              f"QA TIMELINE OK: "
              f"{len(words)} palabras / "
              f"{data['durationMs']} ms"
          )

          print(
              "QA PROSODIA OK: "
              f"{len(prosody.get('segments', []))} segmentos"
          )

          print(
              "DIRECTOR V3.15-C CONFIRMADO"
          )
          PY

      - name: Validar VideoSpec
        run: |
          npm run video:validate -- \
            examples/${PRODUCTION_CODE}.video.json

      - name: Valor humano — Revisar pieza y recursos antes del render
        run: |
          npx --yes tsx scripts/review-human-value.ts "${PRODUCTION_CODE}" final

      - name: Auditoría de autoría — Gate final antes del render
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx --yes tsx scripts/audit-authorship-singularity.ts \
            "${PRODUCTION_CODE}" \
            final
      - name: Renderizar V2 sincronizada
        run: |
          npm run video:render -- \
            examples/${PRODUCTION_CODE}.video.json

      - name: Guardar diagnóstico y memoria visual
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-library-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            public/generated/${{ env.PRODUCTION_CODE }}-resolved-assets.json
            public/generated/${{ env.PRODUCTION_CODE }}-three-d-plan.json
            .cache/visual-memory-v2.json
            content/visual-library/catalog.json
          include-hidden-files: true

      - name: Verificar MP4 universal
        run: |
          test -s "out/${PRODUCTION_CODE}.mp4"

          cp \
            "out/${PRODUCTION_CODE}.mp4" \
            "out/${PRODUCTION_CODE}-FINAL.mp4"

          test -s "out/${PRODUCTION_CODE}-FINAL.mp4"

          ls -lh \
            "out/${PRODUCTION_CODE}-FINAL.mp4"

      # ============================================================
      # REGISTRO POST-RENDER
      # ============================================================

      - name: Registrar Memoria Editorial
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx --yes tsx scripts/editorial-memory.ts \
            register \
            "${PRODUCTION_CODE}"

      - name: V3.18-B — Registrar Memoria Creativa
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npx --yes tsx scripts/creative-memory.ts \
            register \
            "${PRODUCTION_CODE}"

      - name: Subir MP4 final
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PRODUCTION_CODE }}-FINAL
          path: out/${{ env.PRODUCTION_CODE }}-FINAL.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Conservar audio para revisión de preguntas y naturalidad
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vocal-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public/generated/${{ env.PRODUCTION_CODE }}-narration.mp3
            public/generated/${{ env.PRODUCTION_CODE }}-vocal-listening-review.json
            public/generated/${{ env.PRODUCTION_CODE }}-voice-segments/
            public/generated/${{ env.PRODUCTION_CODE }}-timeline.json
            public/generated/${{ env.PRODUCTION_CODE }}.srt
          retention-days: 7
          if-no-files-found: ignore

      - name: Conservar ficha y diagnóstico editorial
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: editorial-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            public/generated/*-autonomous-director.json
            public/generated/*-editorial-memory.json
            public/generated/*-strategic-content.json
            public/generated/*-human-value-*.json
            public/generated/*-human-value-*.md
            public/generated/*-authorship-audit.json
            public/generated/*-authorial-plan.json
            public/generated/*-authorship-audit.md
            public/generated/*-vocal-listening-review.json
            public/generated/*-vocal-score.json
            public/generated/*-prosody-plan.json
            public/generated/*-three-d-plan.json
            public/generated/*-resolved-assets.json
          retention-days: 30
          if-no-files-found: ignore
